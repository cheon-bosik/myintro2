name: 매일 아침 8시, 홈페이지 새로 쓰기

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - name: 1) 내 저장소 파일 가져오기
        uses: actions/checkout@v4

      - name: 2) 오늘 날짜와 한마디로 index.html 새로 쓰기
        run: |
          set -e
          Y=$(TZ='Asia/Seoul' date '+%Y')
          M=$(TZ='Asia/Seoul' date '+%-m')
          D=$(TZ='Asia/Seoul' date '+%-d')
          DOW=$(TZ='Asia/Seoul' date '+%u')
          HM=$(TZ='Asia/Seoul' date '+%H:%M')
          DOY=$(TZ='Asia/Seoul' date '+%j')
          NAMES=(월 화 수 목 금 토 일)
          WEEKDAY=${NAMES[$((DOW-1))]}
          QUOTES=(
            "오늘 하루도 천천히, 그러나 꾸준히."
            "배움에 늦은 나이는 없습니다."
            "작게 시작해서 오래 가는 것이 이깁니다."
            "어제의 나보다 한 줄만 더."
            "모르면 물어보세요. 그게 제일 빠릅니다."
            "쉬는 것도 공부의 일부입니다."
            "오늘 한 걸음이 내일의 나를 만듭니다."
          )
          QUOTE=${QUOTES[$((10#$DOY % 7))]}

          cat > index.html <<EOF
          <!DOCTYPE html>
          <html lang="ko">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>오늘의 한마디</title>
          <style>
            body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
                   background:#0f172a; color:#f8fafc;
                   font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
            .card { background:#1e293b; border-radius:28px; padding:40px 28px; width:86%; max-width:420px;
                    text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.45); }
            .date { font-size:30px; font-weight:700; letter-spacing:1px; }
            .day  { font-size:20px; color:#94a3b8; margin-top:8px; }
            .line { width:60px; height:3px; background:#38bdf8; margin:26px auto; border-radius:3px; }
            .quote{ font-size:24px; line-height:1.6; font-weight:600; color:#e2e8f0; }
            .foot { margin-top:30px; font-size:14px; color:#64748b; line-height:1.7; }
          </style>
          </head>
          <body>
          <div class="card">
            <div class="date">${Y}년 ${M}월 ${D}일</div>
            <div class="day">${WEEKDAY}요일</div>
            <div class="line"></div>
            <div class="quote">&ldquo;${QUOTE}&rdquo;</div>
            <div class="foot">이 페이지는 오늘 ${HM}에<br>로봇이 자동으로 새로 썼습니다.</div>
          </div>
          </body>
          </html>
          EOF

      - name: 3) 바뀐 파일을 저장소에 다시 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "자동 갱신: $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M')"
          git push
